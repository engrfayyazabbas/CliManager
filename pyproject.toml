[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub"
version = "1.1.0"
description = "AgentHub — The Unified AI Developer CLI Manager with Claude Code-inspired UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AgentHub Contributors" }
]
keywords = ["cli", "ai-agents", "developer-tools", "terminal", "claude-code", "gemini", "codex", "opencode", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Terminals",
]
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
agenthub = "agenthub:main"

[tool.setuptools]
py-modules = ["agenthub"]

[tool.setuptools.package-data]
"*" = ["agents.json"]
